services:
  postgres:
    image: postgres:16-alpine
    container_name: psihologpashkov-postgres-prod
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psihologpashkov}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - psihologpashkov_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-psihologpashkov}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: psihologpashkov-api-prod
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - psihologpashkov_uploads_prod_data:/app/backend/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: psihologpashkov-caddy-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - psihologpashkov_caddy_prod_data:/data
      - psihologpashkov_caddy_prod_config:/config
      - psihologpashkov_uploads_prod_data:/app/backend/uploads:ro
      - /opt/psihologpashkov-certs:/etc/caddy/certs:ro

volumes:
  psihologpashkov_postgres_prod_data:
  psihologpashkov_uploads_prod_data:
  psihologpashkov_caddy_prod_data:
  psihologpashkov_caddy_prod_config: