name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "psihologpashkov-backend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build deploy artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        working-directory: psihologpashkov-backend
        run: |
          docker build -t psihologpashkov-api:prod .

      - name: Prepare deploy bundle
        run: |
          mkdir -p /tmp/psihologpashkov-deploy

          tar \
            --exclude=".git" \
            --exclude=".venv" \
            --exclude="**/__pycache__" \
            --exclude="**/.pytest_cache" \
            --exclude="**/.ruff_cache" \
            --exclude="psihologpashkov-backend/.env" \
            --exclude="psihologpashkov-backend/.env.prod" \
            --exclude="psihologpashkov-backend/backups" \
            -czf /tmp/psihologpashkov-deploy/app.tar.gz \
            .

          docker save psihologpashkov-api:prod \
            | gzip > /tmp/psihologpashkov-deploy/api-image.tar.gz

          ls -lh /tmp/psihologpashkov-deploy

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: /tmp/psihologpashkov-deploy/app.tar.gz
          retention-days: 1

      - name: Upload API image artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: /tmp/psihologpashkov-deploy/api-image.tar.gz
          retention-days: 1

  deploy:
    name: Deploy on VM
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64
      - psihologpashkov-prod

    steps:
      - name: Prepare deploy directory
        run: |
          rm -rf /tmp/psihologpashkov-deploy
          mkdir -p /tmp/psihologpashkov-deploy

      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: /tmp/psihologpashkov-deploy

      - name: Download API image
        uses: actions/download-artifact@v4
        with:
          name: api-image
          path: /tmp/psihologpashkov-deploy

      - name: Deploy on local VM
        run: |
          set -euo pipefail

          APP_DIR="/opt/MySiteAuthhor"
          DEPLOY_TMP_DIR="/tmp/psihologpashkov-deploy"
          EXTRACT_DIR="${DEPLOY_TMP_DIR}/extract"

          echo "[deploy] checking required files"
          test -f "${DEPLOY_TMP_DIR}/app.tar.gz"
          test -f "${DEPLOY_TMP_DIR}/api-image.tar.gz"

          echo "[deploy] loading API image"
          gunzip -c "${DEPLOY_TMP_DIR}/api-image.tar.gz" | docker load

          echo "[deploy] extracting project"
          rm -rf "${EXTRACT_DIR}"
          mkdir -p "${EXTRACT_DIR}"
          tar -xzf "${DEPLOY_TMP_DIR}/app.tar.gz" -C "${EXTRACT_DIR}"

          echo "[deploy] syncing project to ${APP_DIR}"
          mkdir -p "${APP_DIR}"

          rsync -a --delete \
            --exclude "psihologpashkov-backend/.env" \
            --exclude "psihologpashkov-backend/.env.prod" \
            --exclude "psihologpashkov-backend/backups" \
            "${EXTRACT_DIR}/" \
            "${APP_DIR}/"

          cd "${APP_DIR}/psihologpashkov-backend"

          echo "[deploy] checking production files"
          test -f ".env.prod"
          test -f "/opt/psihologpashkov-certs/fullchain.pem"
          test -f "/opt/psihologpashkov-certs/privkey.pem"

          echo "[deploy] starting containers"
          docker compose --env-file .env.prod -f infra/compose.prod.yml up -d --no-build

          echo "[deploy] applying migrations"
          docker compose --env-file .env.prod -f infra/compose.prod.yml exec -T api alembic upgrade head

          echo "[deploy] checking API health"
          for i in $(seq 1 30); do
            if docker compose --env-file .env.prod -f infra/compose.prod.yml exec -T api curl -fsS http://127.0.0.1:8000/api/v1/healthz >/dev/null; then
              echo "[deploy] API health OK"
              docker compose --env-file .env.prod -f infra/compose.prod.yml ps
              exit 0
            fi

            echo "[deploy] API not ready yet: ${i}/30"
            sleep 2
          done

          echo "[deploy] API health failed"
          docker compose --env-file .env.prod -f infra/compose.prod.yml logs --tail=100 api
          exit 1